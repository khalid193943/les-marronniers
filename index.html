<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les Marronniers El Jadida - Établissement Scolaire Privé</title>
    <meta name="description" content="Site officiel de l'établissement scolaire privé Les Marronniers El Jadida — Crèche, Maternelle et Primaire (CP au CE6). 16 Lot Al Asdikaa, Rue Beethoven, Plateau, El Jadida." />
    <meta property="og:title" content="Les Marronniers El Jadida - Établissement Scolaire Privé" />
    <meta property="og:description" content="Site officiel de l'établissement scolaire privé Les Marronniers El Jadida — Crèche, Maternelle et Primaire (CP au CE6). 16 Lot Al Asdikaa, Rue Beethoven, Plateau, El Jadida." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Aref Ruqaa Ink (signature Ovo Giggle display font) & Plus Jakarta Sans (clean legible UI/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fff7ef] text-[#00558d] antialiased selection:bg-[#e3a044] selection:text-white min-h-screen">
    <!-- Formulaires statiques cachés : nécessaires pour que Netlify Forms détecte les champs au déploiement -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="tel" name="telephone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="pre-inscription" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="parent" />
      <input type="tel" name="telephone" />
      <input type="email" name="email" />
      <input type="text" name="enfant" />
      <input type="text" name="annee-naissance" />
      <select name="niveau"></select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
